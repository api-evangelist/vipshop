name: VIPShop
description: >-
  VIPShop (唯品会, vip.com) is a Chinese e-commerce company specializing in branded flash sales
  and discount retail, connecting brands with consumers through time-limited special-offer events.
  For partners it runs VOP (VIPShop Open Platform, vop.vip.com), a developer/open platform that lets
  vendors, individual developers, and ISVs integrate with VIPShop's e-commerce systems — covering
  orders, products/commodities, inventory, warehouse and logistics, marketplace, multi-channel and
  new-retail services. VOP exposes a signed, service-based JSON API through the gw.vipapis.com gateway
  (with a sandbox.vipapis.com test environment), ships official Java, PHP, and C# SDKs, and authenticates
  callers with an app-key + secret credential and per-request signature.
